<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1320" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PT Practice">
  <meta name="description" content="Offline Periodic Table practice app for Bangladesh HSC and engineering admission (59 essential elements).">
  <title>Periodic Table Practice</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar">
      <div class="brand">
        <span class="brand-badge" aria-hidden="true">Pt</span>
        <span id="screen-title" class="brand-title">Periodic Table</span>
      </div>
      <div id="topbar-right" class="topbar-right"></div>
    </header>

    <main id="view" class="view" tabindex="-1">
      <noscript>Please enable JavaScript to use Periodic Table Practice.</noscript>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <nav id="tabs" class="tabs" aria-label="Primary navigation">
      <button type="button" class="tab active" data-tab="table" aria-current="page">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 3h7v7H3V3zm11 0h7v7h-7V3zM3 14h7v7H3v-7zm11 3h3v-3h2v3h3v2h-3v3h-2v-3h-3v-2z"/></svg>
        <span>Table</span>
      </button>
      <button type="button" class="tab" data-tab="practice">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <span>Practice</span>
      </button>
      <button type="button" class="tab" data-tab="review">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 19h4v-7H4v7zm6 0h4V5h-4v14zm6 0h4v-4h-4v4z"/></svg>
        <span>Review</span>
      </button>
      <button type="button" class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div id="sheet" class="sheet-wrap" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-backdrop" data-action="close-sheet"></div>
      <div id="sheet-body" class="sheet"></div>
    </div>
  </div>

  <script src="js/data.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/quiz.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
